name: CI

on:
  push:
  pull_request:

jobs:
  native-temporal:
    name: Node 26 (native Temporal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci
      - name: Confirm Temporal is native
        run: node -e "if (globalThis.Temporal === undefined) { console.error('Expected native Temporal on Node 26'); process.exit(1); }"
      - run: npm run types
      - name: Check committed types are up to date
        run: git diff --exit-code types/
      - run: npm run test:coverage

  polyfilled-temporal:
    name: Node 22 (temporal-polyfill)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Confirm Temporal is not native
        run: node -e "if (globalThis.Temporal !== undefined) { console.error('Expected no native Temporal on Node 22'); process.exit(1); }"
      - run: npm test
      - name: Check published file list
        run: npm pack --dry-run
